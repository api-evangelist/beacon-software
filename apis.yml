name: Beacon (Software)
description: 'Beacon Software is a permanent software holding company, founded in 2024
  and led by CEO Nilam Ganenthiran, that acquires and operates essential vertical software
  businesses serving Main Street industries. Rather than flipping acquisitions, Beacon holds
  companies indefinitely, keeping each founder''s team and brand intact while providing a
  centralized operating platform — engineering support, AI integration, sales, finance, and
  a network of portfolio operators — to help them better serve their customers. Backed by
  General Catalyst, Lightspeed Venture Partners, and D1 Capital. Beacon is an acquisition and
  operating company, not a developer-facing platform: it publishes no public API, SDKs, or
  developer portal.'
